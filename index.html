<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Personal planner</p>
          <h1>Daily To-Do List</h1>
        </div>
      </header>

      <section class="task-form-card" aria-label="Add a task">
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">Add a new task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="200"
            placeholder="Add a new task..."
            autocomplete="off"
          />
          <button type="submit" class="primary-btn">Add Task</button>
        </form>
      </section>

      <section class="task-columns">
        <article class="task-panel" aria-labelledby="pending-heading">
          <div class="panel-header">
            <h2 id="pending-heading">Pending Tasks</h2>
            <span id="pending-count" class="count-pill" aria-live="polite">0 pending</span>
          </div>
          <ul id="pending-list" class="task-list" aria-live="polite"></ul>
          <div id="pending-empty" class="empty-state hidden">
            No pending tasks. Add one to get started.
          </div>
        </article>

        <article class="task-panel" aria-labelledby="completed-heading">
          <div class="panel-header">
            <h2 id="completed-heading">Completed Tasks</h2>
            <span id="completed-count" class="count-pill secondary" aria-live="polite">0 completed</span>
          </div>
          <ul id="completed-list" class="task-list" aria-live="polite"></ul>
          <div id="completed-empty" class="empty-state hidden">
            No completed tasks yet. Finish something great.
          </div>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
